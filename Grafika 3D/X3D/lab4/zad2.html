<!DOCTYPE html>
<html>

<head>
    <script type='text/javascript' src='https://www.x3dom.org/download/x3dom.js'> </script>
</head>

<body>
    <x3d width="600px" height="400px">
        <scene>
            <shape>
                <pointset>
                    <coordinate point=" " id="points" />
                </pointset>
            </shape>
        </scene>
    </x3d>

    <script>
        const startX = -5;
        const startY = 0;
        const startZ = 0;
        const dx = 5;
        const numPoints = 50;

        const points = [];

        let x = 0;
        let y = 0;
        let z = 0;

        const step = (dx - startX) / (numPoints - 1);

        for (let i = 0; i < numPoints; i++) {
            x = startX;
            y = startY + i * step;
            z = startZ;
            points.push(`${x} ${y} ${z}`);
        }

        const pointsElement = document.getElementById('points');
        pointsElement.setAttribute('point', points.join(","))
    </script>


</body>

</html>
